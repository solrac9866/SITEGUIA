<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Guia de Aprendizagem — PEI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #1a1a1a;
    --papel: #f4f1ea;
    --papel-2: #e8e3d6;
    --vermelho: #c1272d;
    --azul: #1a4d8f;
    --amarelo: #f5b800;
    --linha: #2a2a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--papel);
    color: var(--tinta);
    font-family: 'Fraunces', Georgia, serif;
    font-size: 17px;
    line-height: 1.55;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(193, 39, 45, 0.06), transparent 50%),
      radial-gradient(circle at 85% 90%, rgba(26, 77, 143, 0.05), transparent 45%);
    padding: 32px 20px 80px;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    border-top: 4px solid var(--linha);
    border-bottom: 1px solid var(--linha);
    padding: 28px 0 24px;
    margin-bottom: 36px;
    position: relative;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--vermelho);
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: clamp(34px, 7vw, 52px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    font-variation-settings: "opsz" 144;
  }

  h1 em {
    font-style: italic;
    font-weight: 400;
    color: var(--vermelho);
  }

  .sub {
    margin-top: 16px;
    font-size: 16px;
    max-width: 560px;
    color: #444;
  }

  .secao { margin-bottom: 32px; }

  .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--azul);
    margin-bottom: 8px;
  }

  label {
    display: block;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    margin-bottom: 6px;
  }

  .ajuda {
    font-size: 14px;
    color: #555;
    margin-bottom: 12px;
    font-style: italic;
  }

  input[type="text"], input[type="password"], textarea {
    width: 100%;
    padding: 14px 16px;
    background: #fff;
    border: 1.5px solid var(--linha);
    border-radius: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--tinta);
    transition: border-color .15s, box-shadow .15s;
  }

  input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
    outline: none;
    border-color: var(--vermelho);
    box-shadow: 3px 3px 0 var(--linha);
  }

  textarea { min-height: 240px; resize: vertical; line-height: 1.5; }
  .pequeno { min-height: auto; }

  details {
    background: var(--papel-2);
    border: 1.5px solid var(--linha);
    padding: 16px 20px;
    margin-bottom: 32px;
  }

  details summary {
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }

  details[open] summary { margin-bottom: 18px; }
  details label { font-size: 15px; margin-top: 14px; }

  button {
    display: block;
    width: 100%;
    padding: 18px 24px;
    background: var(--tinta);
    color: var(--papel);
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform .1s, background .15s;
    position: relative;
  }

  button::after {
    content: '→';
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    transition: transform .2s;
  }

  button:hover:not(:disabled) { background: var(--vermelho); }
  button:hover:not(:disabled):::after { transform: translateY(-50%) translateX(6px); }
  button:disabled { background: #888; cursor: not-allowed; }

  #status {
    margin-top: 28px;
    padding: 20px;
    border: 1.5px solid var(--linha);
    background: #fff;
    display: none;
  }

  #status.ativo { display: block; }
  #status.carregando { border-color: var(--azul); background: #eef3fb; }
  #status.sucesso { border-color: #2d7a2d; background: #f0f8f0; }
  #status.erro { border-color: var(--vermelho); background: #fbeded; }

  .status-titulo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .status-titulo.carregando { color: var(--azul); }
  .status-titulo.sucesso { color: #2d7a2d; }
  .status-titulo.erro { color: var(--vermelho); }

  #status p { font-size: 15px; }

  #status a {
    display: inline-block;
    margin-top: 10px;
    margin-right: 16px;
    padding: 10px 18px;
    background: var(--azul);
    color: #fff;
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #status a:hover { background: var(--vermelho); }

  .pontos { display: inline-block; }
  .pontos span { animation: piscar 1.4s infinite; }
  .pontos span:nth-child(2) { animation-delay: .2s; }
  .pontos span:nth-child(3) { animation-delay: .4s; }
  @keyframes piscar {
    0%, 60%, 100% { opacity: 0.2; }
    30% { opacity: 1; }
  }

  footer {
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid #ccc;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #777;
    letter-spacing: 0.05em;
  }

  footer strong { color: var(--vermelho); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="eyebrow">PEI · SEDUC-SP · Consultoria do Carl</div>
    <h1>Guia de<br>Aprendizagem <em>auto</em></h1>
    <p class="sub">Cole o Escopo Sequência do seu bimestre. A IA estrutura, justifica e devolve o documento pronto na sua pasta do Drive.</p>
  </header>

  <details>
    <summary>⚙ Configuração (preencher 1 vez)</summary>
    <label for="apiKey">Chave da API Gemini</label>
    <div class="ajuda">
