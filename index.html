<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Guia de Aprendizagem — Prof. Carlos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul-profundo: #0a2540;
    --azul-medio: #1e5bb8;
    --azul-claro: #4a90d9;
    --azul-celeste: #e8f0fa;
    --azul-papel: #f4f7fb;
    --azul-borda: #c5d6ea;
    --dourado: #d4a017;
    --texto: #1a2332;
    --texto-suave: #5a6b80;
    --branco: #ffffff;
    --sucesso: #2d7a4f;
    --erro: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--azul-papel);
    color: var(--texto);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    height: auto; 
  }

  body {
    background-image:
      radial-gradient(circle at 0% 0%, rgba(74, 144, 217, 0.08), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(30, 91, 184, 0.06), transparent 50%);
    padding: 0 0 120px; 
    overflow-y: auto;    
  }

  /* ===== CABEÇALHO ===== */
  .hero {
    background: linear-gradient(135deg, var(--azul-profundo) 0%, var(--azul-medio) 100%);
    color: var(--branco);
    padding: 48px 24px 56px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -10%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(212, 160, 23, 0.15), transparent 70%);
    pointer-events: none;
  }

  .hero-inner {
    max-width: 820px;
    margin: 0 auto;
    position: relative;
  }

  .selo {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dourado);
    border: 1px solid rgba(212, 160, 23, 0.4);
    padding: 6px 14px;
    margin-bottom: 24px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 48px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }

  h1 em {
    font-style: italic;
    font-weight: 400;
    color: var(--dourado);
  }

  .hero-sub {
    font-size: 17px;
    color: rgba(255, 255, 255, 0.85);
    max-width: 560px;
    line-height: 1.5;
  }

  /* ===== CONTAINER ===== */
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ===== TUTORIAL ===== */
  .tutorial {
    background: var(--branco);
    border: 1px solid var(--azul-borda);
    border-top: 4px solid var(--azul-medio);
    margin-top: -32px;
    padding: 32px;
    position: relative;
    box-shadow: 0 4px 24px rgba(10, 37, 64, 0.06);
    margin-bottom: 40px;
  }

  .tutorial-titulo {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--azul-profundo);
    margin-bottom: 6px;
  }

  .tutorial-intro {
    color: var(--texto-suave);
    margin-bottom: 28px;
    font-size: 15px;
  }

  .passos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  .passo {
    position: relative;
    padding: 20px 18px 18px;
    background: var(--azul-celeste);
    border-left: 3px solid var(--azul-medio);
  }

  .passo-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: var(--azul-medio);
    color: var(--branco);
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 16px;
    border-radius: 50%;
    margin-bottom: 12px;
  }

  .passo-titulo {
    font-weight: 600;
    color: var(--azul-profundo);
    margin-bottom: 6px;
    font-size: 15px;
  }

  .passo-texto {
    font-size: 14px;
    color: var(--texto-suave);
    line-height: 1.5;
  }

  /* ===== DESTAQUE ===== */
  .destaque {
    background: linear-gradient(to right, var(--azul-celeste), var(--branco));
    border: 1px solid var(--azul-borda);
    border-left: 4px solid var(--dourado);
    padding: 20px 24px;
    margin-bottom: 36px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .destaque-icone {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    background: var(--dourado);
    color: var(--branco);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 18px;
    border-radius: 50%;
  }

  .destaque-texto {
    font-size: 15px;
    color: var(--texto);
    line-height: 1.55;
  }

  .destaque-texto strong { color: var(--azul-profundo); }

  /* ===== FORMULÁRIO ===== */
  .form-card {
    background: var(--branco);
    border: 1px solid var(--azul-borda);
    padding: 36px;
    box-shadow: 0 2px 16px rgba(10, 37, 64, 0.04);
  }

  .secao { margin-bottom: 28px; }
  .secao:last-of-type { margin-bottom: 0; }

  .secao-num {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--azul-medio);
    background: var(--azul-celeste);
    padding: 4px 10px;
    margin-bottom: 10px;
  }

  label {
    display: block;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    color: var(--azul-profundo);
    margin-bottom: 6px;
  }

  .ajuda {
    font-size: 14px;
    color: var(--texto-suave);
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .ajuda strong { color: var(--azul-medio); }

  input[type="text"], textarea {
    width: 100%;
    padding: 14px 16px;
    background: var(--branco);
    border: 1.5px solid var(--azul-borda);
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--texto);
    transition: border-color .15s, box-shadow .15s;
  }

  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--azul-medio);
    box-shadow: 0 0 0 3px rgba(30, 91, 184, 0.12);
  }

  textarea {
    min-height: 220px;
    resize: vertical;
    line-height: 1.5;
    font-family: 'Inter', sans-serif;
  }

  .pequeno { min-height: auto; }

  /* ===== BOTÃO ===== */
  button {
    display: block;
    width: 100%;
    padding: 18px 24px;
    margin-top: 28px;
    background: var(--azul-medio);
    color: var(--branco);
    border: none;
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s, transform .1s;
    position: relative;
    box-shadow: 0 4px 12px rgba(30, 91, 184, 0.25);
  }

  button::after {
    content: ' →';
    transition: transform .2s;
    display: inline-block;
  }

  button:hover:not(:disabled) {
    background: var(--azul-profundo);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(10, 37, 64, 0.3);
  }

  button:hover:not(:disabled)::after {
    transform: translateX(4px);
  }

  button:disabled {
    background: var(--texto-suave);
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ===== STATUS ===== */
  #status {
    margin-top: 24px;
    padding: 20px 24px;
    border-radius: 4px;
    border: 1px solid var(--azul-borda);
    background: var(--branco);
    display: none;
  }

  #status.ativo { display: block; }
  #status.carregando { border-color: var(--azul-medio); background: var(--azul-celeste); }
  #status.sucesso { border-color: var(--sucesso); background: #eaf6ef; }
  #status.erro { border-color: var(--erro); background: #fbeded; }

  .status-titulo {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    margin-bottom: 8px;
  }

  .status-titulo.carregando { color: var(--azul-medio); }
  .status-titulo
